# WORK GALLERY
# To add a piece of work:
#   1. Put the image in src/assets/gallery/ (or reuse one in src/assets/work/)
#   2. Add ONE line below, in the same format. The name before the colon must be unique.
# The numbers at the start of each name set the order. Every line needs: image (folder/file name), what, did, alt.
# Optional: tool (leave it out if unsure), edited: true (personal details were replaced or blurred).
# Images: designs only. Faces, names, numbers and anything private must be blurred or replaced first.

01-womens-day: { image: "work/womens-day.webp", what: "International Women's Day post", did: "Took and edited the photographs, designed the layout, and wrote the headline and caption. I adapted an existing template.", edited: true, alt: "Graphic headed Happy International Women's Day, dated March 2026, with the BlayCare logo, a short message celebrating compassion, strength and dedication, and two members of staff whose faces are blurred. A Supporting International Women's Day banner sits at the bottom." }
